<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDZ TTGO Sonde USB įrašymas</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#111827; color:#fff; margin:0; padding:30px 15px; text-align:center; }
    .box { max-width:560px; margin:auto; padding:30px; background:#1f2937; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    h1 { margin-top:0; }
    p { color:#d1d5db; line-height:1.55; }
    button { font-size:18px; padding:14px 22px; border:0; border-radius:10px; cursor:pointer; }
    .note { margin-top:22px; font-size:14px; color:#9ca3af; }
  </style>
</head>
<body>
  <div class="box">
    <h1>RDZ TTGO Sonde</h1>
    <p>Prijunk ESP32 prie kompiuterio USB duomenų laidu. Atidaryk šį puslapį su Google Chrome arba Microsoft Edge.</p>
    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">Prijungti ESP ir įrašyti</button>
      <span slot="unsupported">Ši naršyklė nepalaiko USB įrašymo. Naudok Chrome arba Edge kompiuteryje.</span>
    </esp-web-install-button>
    <div class="note">Įrašant naują diegimą gali būti ištrinti ankstesni nustatymai.</div>
  </div>
</body>
</html>
