<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Andriuxa OTA atnaujinimas</title>
</head>
<body>
  <form action="update.html" method="post">
    <p>Dabar įdiegta: <strong>%FULLNAMEID%</strong></p>
    <p>Naujausia tavo GitHub versija: <strong id="develDiv">tikrinama...</strong></p>
    <input type="submit" name="dev2" value="Atnaujinti iš Andriuxa GitHub">
  </form>

  <p>Atnaujinimas atsisiunčia tik iš:</p>
  <p><tt>https://andriux26.github.io/rdz_ttgo_sonde/</tt></p>
  <p>Bus atnaujinta interneto sąsaja ir pati ESP32 programa.</p>

  <script>
    const develInfo = document.getElementById('develDiv');
    const versionUrl = 'https://andriux26.github.io/rdz_ttgo_sonde/update-info.html?t=' + Date.now();

    fetch(versionUrl, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(text => {
        develInfo.textContent = text.replace(/<[^>]*>/g, '').trim();
      })
      .catch(error => {
        develInfo.textContent = 'nepavyko patikrinti: ' + error.message;
      });
  </script>
</body>
</html>
