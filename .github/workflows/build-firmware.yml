name: Build firmware and USB flasher

on:
  workflow_dispatch:
  push:
    branches: [dev2]
    paths-ignore:
      - 'firmware/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install missing NetworkClientSecure library
        run: |
          rm -rf /tmp/arduino-esp32-3.1.0 /tmp/arduino-esp32.tar.gz
          curl -L --fail --retry 3 \
            https://github.com/espressif/arduino-esp32/archive/refs/tags/3.1.0.tar.gz \
            -o /tmp/arduino-esp32.tar.gz
          tar -xzf /tmp/arduino-esp32.tar.gz -C /tmp
          mkdir -p lib
          cp -R /tmp/arduino-esp32-3.1.0/libraries/NetworkClientSecure lib/NetworkClientSecure
          test -f lib/NetworkClientSecure/src/NetworkClientSecure.h

      - name: Configure firmware to use my GitHub Pages OTA only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RX_FSK/RX_FSK.ino')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '#include <WiFi.h>\n',
              '#include <WiFi.h>\n#include <NetworkClientSecure.h>\n',
              1,
          )

          text = text.replace(
              'const char *updateHost = "rdzsonde.mooo.com";\n'
              'int updatePort = 80;\n\n'
              'const char *updatePrefixM = "/main/";\n'
              'const char *updatePrefixD = "/dev2/";',
              'const char *updateHost = "andriux26.github.io";\n'
              'int updatePort = 443;\n\n'
              'const char *updatePrefixM = "/rdz_ttgo_sonde/";\n'
              'const char *updatePrefixD = "/rdz_ttgo_sonde/";',
              1,
          )

          text = text.replace(
              'WiFiClient client;',
              'NetworkClientSecure client;',
              1,
          )

          text = text.replace(
              'void execOTA() {\n',
              'void execOTA() {\n  // GitHub Pages uses HTTPS. Certificate validation is disabled because\n'
              '  // this ESP32 build does not carry a maintained CA bundle.\n'
              '  client.setInsecure();\n'
              '  client.setTimeout(15000);\n',
              1,
          )

          required = [
              '#include <NetworkClientSecure.h>',
              'const char *updateHost = "andriux26.github.io";',
              'int updatePort = 443;',
              'NetworkClientSecure client;',
              'client.setInsecure();',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'OTA patch failed, missing: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build complete firmware image
        run: pio run -e ttgo-lora32 -t firmware

      - name: Prepare firmware and OTA files
        run: |
          mkdir -p firmware docs

          cp .pio/build/ttgo-lora32/firmware-image.bin firmware/firmware-image.bin
          cp .pio/build/ttgo-lora32/firmware.bin firmware/firmware.bin
          cp .pio/build/ttgo-lora32/littlefs.bin firmware/littlefs.bin
          cp .pio/build/ttgo-lora32/fonts.bin firmware/fonts.bin

          cp .pio/build/ttgo-lora32/firmware-image.bin docs/firmware-image.bin
          cp .pio/build/ttgo-lora32/firmware.bin docs/update.ino.bin
          python3 scripts/makefsupdate.py RX_FSK/data > docs/update.fs.bin
          cp docs/update.ino.bin firmware/update.ino.bin
          cp docs/update.fs.bin firmware/update.fs.bin

          BASE_VERSION=$(sed -n 's/.*version_id = "\([^"]*\)".*/\1/p' RX_FSK/version.h)
          FS_MAJOR=$(sed -n 's/.*FS_MAJOR=\([0-9]*\).*/\1/p' RX_FSK/version.h)
          FS_MINOR=$(sed -n 's/.*FS_MINOR=\([0-9]*\).*/\1/p' RX_FSK/version.h)
          FS_LETTER=$(printf "\\$(printf '%03o' $((FS_MAJOR + 64)))")
          SHORT_SHA=$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)
          DISPLAY_VERSION="${BASE_VERSION}-${SHORT_SHA}-${FS_LETTER}${FS_MINOR}"

          printf '%s\n' "${DISPLAY_VERSION}" > firmware/version.txt
          printf '%s\n' "${DISPLAY_VERSION}" > docs/update-info.html
          printf '{\n  "version": "%s",\n  "branch": "dev2",\n  "commit": "%s",\n  "built_at_utc": "%s"\n}\n' \
            "${DISPLAY_VERSION}" "${GITHUB_SHA}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > firmware/build-info.json

      - name: Save latest firmware in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/
          if git diff --cached --quiet; then
            echo "Firmware files have not changed."
          else
            git commit -m "Update latest firmware binaries [skip ci]"
            git push origin HEAD:dev2
          fi

      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: rdz-ttgo-sonde-dev2-firmware
          path: |
            firmware/firmware-image.bin
            firmware/firmware.bin
            firmware/littlefs.bin
            firmware/fonts.bin
            firmware/update.ino.bin
            firmware/update.fs.bin
            firmware/version.txt
            firmware/build-info.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload USB flasher and OTA files
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy USB flasher and OTA files
        id: deployment
        uses: actions/deploy-pages@v4
